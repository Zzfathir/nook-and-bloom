<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#24352B" />
    <link rel="icon" href="/favicon.svg" />
    <title>Page not found | Nook & Bloom</title>
    <style>
      :root {
        color: #f7f1e6;
        background: #24352b;
        font-family: Georgia, serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 32px;
      }
      main {
        max-width: 620px;
        text-align: center;
      }
      p {
        color: #c9785a;
        font: 11px/1.2 monospace;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      h1 {
        margin: 24px 0 18px;
        font-size: clamp(48px, 9vw, 90px);
        font-weight: 500;
        line-height: 0.95;
        letter-spacing: -0.04em;
      }
      h1 em {
        color: #c9785a;
      }
      a {
        display: inline-block;
        margin-top: 24px;
        padding: 15px 20px;
        color: #24352b;
        background: #f7f1e6;
        font:
          12px Arial,
          sans-serif;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 2px solid #c9785a;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <p>Sorry, we took a wrong turn</p>
      <h1>This corner<br /><em>isn't here.</em></h1>
      <a href="/">Back to Nook & Bloom <span aria-hidden="true">↗</span></a>
    </main>
  </body>
</html>
